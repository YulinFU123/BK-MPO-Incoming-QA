<svg xmlns="http://www.w3.org/2000/svg" width="960" height="320" viewBox="0 0 960 320" role="img"><title>准备本机可读的下载文件（示意，非截图）</title><g font-family="Microsoft YaHei, sans-serif"><rect width="960" height="320" rx="12" fill="#fbfcfd"/><text x="38" y="36" font-size="16" font-weight="600" fill="#18716b">BI 引导   /   系统文件 · 操作示意</text><text x="38" y="80" font-size="31" font-weight="700" fill="#233951">准备本机可读的下载文件</text><text x="38" y="113" font-size="17" font-weight="450" fill="#456077">异常品查询_演示.xlsx</text><rect x="38" y="136" width="278" height="92" rx="8" fill="#f2f5f8"/><text x="52" y="165" font-size="15" font-weight="650" fill="#233951">文件资源管理器 / OneDrive</text><text x="52" y="203" font-size="17" font-weight="500" fill="#496279">文件夹中的源表</text><text x="320" y="188" font-size="19" font-weight="500" fill="#779195">→</text><rect x="342" y="136" width="278" height="92" rx="8" fill="#e3f4f1"/><text x="356" y="165" font-size="18" font-weight="650" fill="#233951">始终保留在此设备上</text><text x="356" y="203" font-size="17" font-weight="500" fill="#125a58">右键菜单</text><text x="624" y="188" font-size="19" font-weight="500" fill="#779195">→</text><rect x="646" y="136" width="278" height="92" rx="8" fill="#f2f5f8"/><text x="660" y="165" font-size="18" font-weight="650" fill="#233951">本机可用</text><text x="660" y="203" font-size="17" font-weight="500" fill="#496279">同步完成后识别</text><path d="M38 253H922" stroke="#c9d9de"/><text x="38" y="286" font-size="18" font-weight="500" fill="#233951">关闭占用源表的 Excel；等同步完成后再识别表头。</text></g></svg>