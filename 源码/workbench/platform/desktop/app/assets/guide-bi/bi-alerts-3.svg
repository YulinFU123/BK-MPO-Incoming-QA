<svg xmlns="http://www.w3.org/2000/svg" width="960" height="320" viewBox="0 0 960 320" role="img"><title>用实际数量复核人员排名提醒（示意，非截图）</title><g font-family="Microsoft YaHei, sans-serif"><rect width="960" height="320" rx="12" fill="#fbfcfd"/><text x="38" y="36" font-size="16" font-weight="600" fill="#18716b">BI 引导   /   Excel 输出 · 预警示意</text><text x="38" y="80" font-size="31" font-weight="700" fill="#233951">用实际数量复核人员排名提醒</text><text x="38" y="113" font-size="17" font-weight="450" fill="#456077">2026年11月　/　演示甲：24 pcs　/　本月合计：48 pcs</text><rect x="38" y="136" width="278" height="92" rx="8" fill="#f2f5f8"/><text x="52" y="165" font-size="15" font-weight="650" fill="#233951">03_月度分析 / 人员不良TOP20</text><text x="52" y="203" font-size="17" font-weight="500" fill="#496279">人员总览</text><text x="320" y="188" font-size="19" font-weight="500" fill="#779195">→</text><rect x="342" y="136" width="278" height="92" rx="8" fill="#f2f5f8"/><text x="356" y="165" font-size="18" font-weight="650" fill="#233951">不良pcs</text><text x="356" y="203" font-size="17" font-weight="500" fill="#496279">演示甲：24</text><text x="624" y="188" font-size="19" font-weight="500" fill="#779195">→</text><rect x="646" y="136" width="278" height="92" rx="8" fill="#e3f4f1"/><text x="660" y="165" font-size="18" font-weight="650" fill="#233951">占比</text><text x="660" y="203" font-size="17" font-weight="500" fill="#125a58">24 / 48 = 50%</text><path d="M38 253H922" stroke="#c9d9de"/><text x="38" y="286" font-size="18" font-weight="500" fill="#233951">人员总览的分母是本月全部不良 pcs；还要核对最少 pcs，不据颜色定责。</text></g></svg>