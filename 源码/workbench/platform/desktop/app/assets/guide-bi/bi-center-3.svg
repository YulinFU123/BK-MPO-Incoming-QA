<svg xmlns="http://www.w3.org/2000/svg" width="960" height="320" viewBox="0 0 960 320" role="img"><title>从历史工具找到对应设置（示意，非截图）</title><g font-family="Microsoft YaHei, sans-serif"><rect width="960" height="320" rx="12" fill="#fbfcfd"/><text x="38" y="36" font-size="16" font-weight="600" fill="#18716b">BI 引导   /   原生菜单 · 分组示意</text><text x="38" y="80" font-size="31" font-weight="700" fill="#233951">从历史工具找到对应设置</text><text x="38" y="113" font-size="17" font-weight="450" fill="#456077">历史驾驶舱设置　/　历史预警规则　/　BI配置与工具</text><rect x="38" y="136" width="278" height="92" rx="8" fill="#f2f5f8"/><text x="52" y="165" font-size="18" font-weight="650" fill="#233951">历史工具</text><text x="52" y="203" font-size="17" font-weight="500" fill="#496279">获取与导入等分类</text><text x="320" y="188" font-size="19" font-weight="500" fill="#779195">→</text><rect x="342" y="136" width="278" height="92" rx="8" fill="#e3f4f1"/><text x="356" y="165" font-size="18" font-weight="650" fill="#233951">辅助配置</text><text x="356" y="203" font-size="17" font-weight="500" fill="#125a58">分母、预警与工具</text><text x="624" y="188" font-size="19" font-weight="500" fill="#779195">→</text><rect x="646" y="136" width="278" height="92" rx="8" fill="#f2f5f8"/><text x="660" y="165" font-size="18" font-weight="650" fill="#233951">历史检查分母</text><text x="660" y="203" font-size="17" font-weight="500" fill="#496279">每日检查量</text><path d="M38 253H922" stroke="#c9d9de"/><text x="38" y="286" font-size="18" font-weight="500" fill="#233951">人员名单及不良分类在「筛选与字典」；各来源的临时筛选分别记忆。</text></g></svg>