<svg xmlns="http://www.w3.org/2000/svg" width="960" height="320" viewBox="0 0 960 320" role="img"><title>核对图题、分类与数量口径（示意，非截图）</title><g font-family="Microsoft YaHei, sans-serif"><rect width="960" height="320" rx="12" fill="#fbfcfd"/><text x="38" y="36" font-size="16" font-weight="600" fill="#18716b">BI 引导   /   Excel 输出 · 图表示意</text><text x="38" y="80" font-size="31" font-weight="700" fill="#233951">核对图题、分类与数量口径</text><text x="38" y="113" font-size="17" font-weight="450" fill="#456077">方案：全部工序　/　指标：pcs　/　图表类型：饼图</text><rect x="38" y="136" width="278" height="92" rx="8" fill="#f2f5f8"/><text x="52" y="165" font-size="18" font-weight="650" fill="#233951">06_自定义图表</text><text x="52" y="203" font-size="17" font-weight="500" fill="#496279">生成的工作表</text><text x="320" y="188" font-size="19" font-weight="500" fill="#779195">→</text><rect x="342" y="136" width="278" height="92" rx="8" fill="#e3f4f1"/><text x="356" y="165" font-size="18" font-weight="650" fill="#233951">各工序不良占比</text><text x="356" y="203" font-size="17" font-weight="500" fill="#125a58">分类：责任工序</text><text x="624" y="188" font-size="19" font-weight="500" fill="#779195">→</text><rect x="646" y="136" width="278" height="92" rx="8" fill="#f2f5f8"/><text x="660" y="165" font-size="18" font-weight="650" fill="#233951">责任工序</text><text x="660" y="203" font-size="17" font-weight="500" fill="#496279">07-装管：48 pcs</text><path d="M38 253H922" stroke="#c9d9de"/><text x="38" y="286" font-size="18" font-weight="500" fill="#233951">占比 = 该工序不良 pcs ÷ 筛选内不良 pcs；不是检验不良率。</text></g></svg>