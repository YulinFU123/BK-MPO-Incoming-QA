<svg xmlns="http://www.w3.org/2000/svg" width="960" height="320" viewBox="0 0 960 320" role="img"><title>将当日检查量与看板不良量配对（示意，非截图）</title><g font-family="Microsoft YaHei, sans-serif"><rect width="960" height="320" rx="12" fill="#fbfcfd"/><text x="38" y="36" font-size="16" font-weight="600" fill="#18716b">BI 引导   /   Excel 输出 · 分母示意</text><text x="38" y="80" font-size="31" font-weight="700" fill="#233951">将当日检查量与看板不良量配对</text><text x="38" y="113" font-size="17" font-weight="450" fill="#456077">2026-11-21　/　每日看板　/　不良pcs：4</text><rect x="38" y="136" width="278" height="92" rx="8" fill="#f2f5f8"/><text x="52" y="165" font-size="18" font-weight="650" fill="#233951">02_趋势分析 / 业务日</text><text x="52" y="203" font-size="17" font-weight="500" fill="#496279">2026-11-21</text><text x="320" y="188" font-size="19" font-weight="500" fill="#779195">→</text><rect x="342" y="136" width="278" height="92" rx="8" fill="#f2f5f8"/><text x="356" y="165" font-size="18" font-weight="650" fill="#233951">检查量</text><text x="356" y="203" font-size="17" font-weight="500" fill="#496279">1,200</text><text x="624" y="188" font-size="19" font-weight="500" fill="#779195">→</text><rect x="646" y="136" width="278" height="92" rx="8" fill="#e3f4f1"/><text x="660" y="165" font-size="18" font-weight="650" fill="#233951">不良率</text><text x="660" y="203" font-size="17" font-weight="500" fill="#125a58">4 ÷ 1,200</text><path d="M38 253H922" stroke="#c9d9de"/><text x="38" y="286" font-size="18" font-weight="500" fill="#233951">同日、同方案：4 ÷ 1,200 ≈ 0.33%；缺少有效检查量时不推算。</text></g></svg>