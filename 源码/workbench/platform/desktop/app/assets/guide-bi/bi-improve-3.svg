<svg xmlns="http://www.w3.org/2000/svg" width="960" height="320" viewBox="0 0 960 320" role="img"><title>对比同一项目的前后日均（示意，非截图）</title><g font-family="Microsoft YaHei, sans-serif"><rect width="960" height="320" rx="12" fill="#fbfcfd"/><text x="38" y="36" font-size="16" font-weight="600" fill="#18716b">BI 引导   /   Excel 输出 · 字段示意</text><text x="38" y="80" font-size="31" font-weight="700" fill="#233951">对比同一项目的前后日均</text><text x="38" y="113" font-size="17" font-weight="450" fill="#456077">装管方向复核 · 示例　/　07-装管　/　前后各 2 个生产日</text><rect x="38" y="136" width="278" height="92" rx="8" fill="#f2f5f8"/><text x="52" y="165" font-size="18" font-weight="650" fill="#233951">07_改善项目</text><text x="52" y="203" font-size="17" font-weight="500" fill="#496279">同一工序与项目</text><text x="320" y="188" font-size="19" font-weight="500" fill="#779195">→</text><rect x="342" y="136" width="278" height="92" rx="8" fill="#e3f4f1"/><text x="356" y="165" font-size="18" font-weight="650" fill="#233951">改善前日均</text><text x="356" y="203" font-size="17" font-weight="500" fill="#125a58">4.5 pcs / 日</text><text x="624" y="188" font-size="19" font-weight="500" fill="#779195">→</text><rect x="646" y="136" width="278" height="92" rx="8" fill="#f2f5f8"/><text x="660" y="165" font-size="18" font-weight="650" fill="#233951">改善后日均</text><text x="660" y="203" font-size="17" font-weight="500" fill="#496279">5.5 pcs / 日</text><path d="M38 253H922" stroke="#c9d9de"/><text x="38" y="286" font-size="18" font-weight="500" fill="#233951">日均由 4.5 增为 5.5 pcs，不能据此断定原因。</text></g></svg>