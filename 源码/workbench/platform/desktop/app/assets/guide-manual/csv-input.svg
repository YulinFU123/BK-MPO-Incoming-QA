<text x="45" y="177" font-size="22" fill="#163746">DEMO-CSV-0001,2026-04-16,外观异常,0012</text>
<text x="45" y="221" font-size="22" fill="#163746">,2026-04-16,尺寸偏差,0013</text><text x="28" y="272" font-size="16" fill="#476071">此例以逗号分列；TSV 以制表符分列。0012 和 12 不应当作同一编号。</text></g></svg>