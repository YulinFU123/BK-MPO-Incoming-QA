<svg xmlns="http://www.w3.org/2000/svg" width="960" height="440" viewBox="0 0 960 440" role="img" aria-label="先试印一页，再打印整批：针对性示意"><style>text{font-family:'Microsoft YaHei',sans-serif;fill:#19364b}.k{fill:#246266;font-weight:bold;font-size:17px}.h{font-size:32px;font-weight:bold}.s{font-size:18px;fill:#506677}.b{font-size:22px;font-weight:bold}.v{font-size:22px}.n{font-size:16px;fill:#516879}</style><rect width="960" height="440" rx="15" fill="#f4f8fa"/><path d="M30 32h46" stroke="#267773" stroke-width="4"/><text x="88" y="38" class="k">针对性示意　/　打印驱动设置</text><text x="30" y="93" class="h">先试印一页，再打印整批</text><rect x="30" y="125" width="510" height="242" rx="12" fill="white" stroke="#bdcdd4"/><text x="54" y="167" class="b">打印范围：第 1 页</text><rect x="50" y="204" width="470" height="64" rx="8" fill="#e7f4f1" stroke="#398079"/><circle cx="81" cy="236" r="12" fill="white" stroke="#267773" stroke-width="2"/><circle cx="81" cy="236" r="6" fill="#267773"/><text x="107" y="244" class="b">实际大小（100%）</text><circle cx="81" cy="312" r="12" fill="white" stroke="#9aabb3"/><text x="107" y="319" class="s">适应页面（不要选）</text><text x="585" y="167" class="b">拿首张样纸核对</text><text x="585" y="220" class="v">01　量标签宽高与间距</text><text x="585" y="270" class="v">02　对照边缘和裁切位置</text><text x="585" y="320" class="v">03　扫码比对印刷编号</text><text x="30" y="410" class="n">外部打印窗口随驱动而异，此图不是实机截图；先核对纸张规格，再检查缩放。</text></svg>
