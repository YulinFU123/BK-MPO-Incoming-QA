<svg xmlns="http://www.w3.org/2000/svg" width="960" height="440" viewBox="0 0 960 440" role="img" aria-label="升级后，用副本对照原版：针对性示意"><style>text{font-family:'Microsoft YaHei',sans-serif;fill:#19364b}.k{fill:#246266;font-weight:bold;font-size:17px}.h{font-size:32px;font-weight:bold}.s{font-size:18px;fill:#506677}.b{font-size:22px;font-weight:bold}.v{font-size:22px}.n{font-size:16px;fill:#516879}</style><rect width="960" height="440" rx="15" fill="#f4f8fa"/><path d="M30 32h46" stroke="#267773" stroke-width="4"/><text x="88" y="38" class="k">针对性示意　/　跨版本复核</text><text x="30" y="93" class="h">升级后，用副本对照原版</text><rect x="30" y="140" width="900" height="200" rx="10" fill="white" stroke="#aabfc9"/><path d="M30 196h900 M30 245h900 M30 293h900 M260 140v200 M610 140v200" stroke="#cad8dd" fill="none"/><g class="k"><text x="52" y="176">核对项</text><text x="282" y="176">原版 · 只读参照</text><text x="632" y="176">新版 · 独立副本</text></g><g class="s"><text x="52" y="229">记录与字段</text><text x="282" y="229">12 条；样本编号 QA-001</text><text x="632" y="229">相同范围，逐项比对</text><text x="52" y="277">BI 资料范围</text><text x="282" y="277">示例：11 月 1 日至 7 日</text><text x="632" y="277">核对来源、起止日与总量</text><text x="52" y="325">常用模板</text><text x="282" y="325">示例：夹具标签 50 × 50 mm</text><text x="632" y="325">打开模板核对尺寸及字段</text></g><text x="30" y="384" class="b">发现差异：关闭新版，回到独立旧版；不要覆盖唯一原件。</text><text x="30" y="419" class="n">示例数据仅说明核对方法，不代表实际迁移或备份已成功。</text></svg>
