<!doctype html><html lang="zh-CN"><meta charset="utf-8"><title>合成PowerBI切片器测试</title><style>body{font:14px sans-serif;margin:10px}.slicerBody{padding:8px;border:1px solid #ccc;min-height:30px}.slicerItemContainer{display:block;height:22px;min-width:80px}.scroll-content{height:120px;overflow:auto;min-width:220px}input,button{margin:4px}#popup{min-width:280px}</style><body>
