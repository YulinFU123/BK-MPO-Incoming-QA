<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1" />
    <meta
      http-equiv="Content-Security-Policy"
      content="default-src 'self';script-src 'self';style-src 'self';connect-src 'self';object-src 'none';base-uri 'none'"
    />
    <title>解读与核对实际界面检查</title>
    <link rel="stylesheet" href="choices-check.css" />

      <h1>变化解读与数据核对</h1>

      <table>
        <thead>
          <tr>

        <tbody id="featureResults"></tbody>
      </table>
      <pre id="featureResultJSON"></pre>
